<!DOCTYPE html>
<html>

<head>

    <title>RGB and Hex Colors</title>

    <style>

        .heading {
            color: #1A73E8;
        }

        .card {
            background-color: rgb(245, 247, 250);
            color: rgb(33, 37, 41);
        }

    </style>

</head>

<body>

    <h1 class="heading">
        HTML and CSS
    </h1>

    <div class="card">
        <p>
            This is a CSS styled card.
        </p>
    </div>

</body>

</html>
