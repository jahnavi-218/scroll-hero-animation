<!DOCTYPE html>
<html>
    <head>
        <title>Student Profile Card</title>
        <style>
            .card{
                background-color: green;
                height: 500px;
                width: 400px;
                border:  2px solid gray;
                position:absolute;
                top: 50px;
                right: 50%;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>John Doe</h2>

            <p id="college">University of Technology</p>

            <p>Computer Science</p>

            <p>johndoe@email.com</p>

            <p><b>Skills:</b>HTML, CSS, JavaScript, Figma</p>

            <p>Passionate about web development and UI/UX design.</p>

            <button>View Profile</button>

        </div>
        
    </body>
</html>
